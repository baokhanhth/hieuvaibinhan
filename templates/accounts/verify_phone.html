{% load static %}

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
</head>

<body>

<div class="background">

    <div class="auth-card">

        <a href="{% url 'forgot_pwd' %}" class="back">
            Quay lại
        </a>

        <div class="logo">
            <img src="{% static 'img/logo.jpg' %}" alt="Logo">
        </div>

        <h2 class="title">Xác thực OTP</h2>

        <form method="POST">

            {% csrf_token %}

            <label for="{{ form.otp.id_for_label }}">
                Mã OTP
            </label>

            {{ form.otp }}

            {% if form.otp.errors %}
                <small class="error">
                    {{ form.otp.errors.0 }}
                </small>
            {% endif %}

            <button type="submit" class="auth-button">
                Đổi mật khẩu
            </button>

        </form>

    </div>

</div>

</body>
</html>
